# Netlify: builds the Next.js app from GitHub with Netlify's Next.js adapter (OpenNext).
# Set these in Site configuration -> Environment variables BEFORE the first build
# (NEXT_PUBLIC_* values are inlined at build time):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_SITE_URL (optional; defaults to the site's Netlify URL)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
