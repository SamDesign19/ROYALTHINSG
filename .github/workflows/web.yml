name: Storefront

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build needs no database: every page is rendered on demand (ISR / dynamic).
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Local stack (PostgreSQL + PostgREST with test fixtures)
        run: scripts/local-stack.sh up && cp .local-stack/env .env.local && cat .local-stack/env >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
